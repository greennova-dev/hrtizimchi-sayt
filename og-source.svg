  <text x="60" y="576" font-size="25" font-weight="650" letter-spacing="-.5" fill="#0d1f3c">hrtizimchi.uz</text>

  <rect x="796" y="548" width="146" height="42" rx="21" fill="#1a6dff" fill-opacity=".1" stroke="#1a6dff" stroke-opacity=".22"/>
