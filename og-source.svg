  <rect x="954" y="548" width="186" height="42" rx="21" fill="#1a6dff" fill-opacity=".1" stroke="#1a6dff" stroke-opacity=".22"/>
  <text x="1047" y="575" text-anchor="middle" font-size="16" font-weight="600" fill="#0b48b8">Karta kerak emas</text>
