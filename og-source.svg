  <text x="760" y="324" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="-.6" fill="#0d1f3c">93%</text>
  <text x="806" y="313" font-size="14.5" font-weight="550" fill="#0d1f3c">Davomat darajasi</text>
