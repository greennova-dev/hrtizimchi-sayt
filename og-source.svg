    <text x="60" y="292" fill="#0b48b8">GPS davomat</text>
    <text x="60" y="352">va ish haqi</text>
  </g>
  <g font-size="21" fill="#3d5175">
    <text x="60" y="404">Xodim «Keldim» bosadi — ishlangan soat</text>
    <text x="60" y="434">o'zi hisoblanadi, ish haqi shundan chiqadi.</text>
  </g>

  <!-- mahsulot kartasi -->
