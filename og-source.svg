  <rect x="714" y="280" width="402" height="76" rx="16" fill="#f5f8fd"/>
  <circle cx="760" cy="318" r="27" fill="none" stroke="#e2ebfa" stroke-width="9"/>
  <circle cx="760" cy="318" r="27" fill="none" stroke="#1a6dff" stroke-width="9" stroke-linecap="round"
