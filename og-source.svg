<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!--
    Ijtimoiy tarmoq oldindan ko'rish rasmining manbasi (og.jpg uchun).
    Vektor: matn har qanday o'lchamda tiniq chiqadi.
    Qayta yasash: README dagi "Oldindan ko'rish rasmi" bo'limi.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#dee8f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="-0.05" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.04" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#d6e4fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#d6e4fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2b7bff"/>
      <stop offset="1" stop-color="#0b48b8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- brend -->
  <rect x="60" y="56" width="46" height="46" rx="13" fill="url(#mark)"/>
  <path d="M74 68v22M92 68v22M74 79h18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <text x="120" y="88" font-size="25" font-weight="650" letter-spacing="-.5" fill="#0d1f3c">Tizimchi <tspan fill="#0b48b8">HR</tspan></text>

  <!-- sarlavha -->
  <g font-size="54" font-weight="660" letter-spacing="-1.9" fill="#0d1f3c">
