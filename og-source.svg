  </g>
  <text x="768" y="396" font-size="14.5" font-weight="600" fill="#ffffff">100 m geofence</text>
  <text x="768" y="416" font-size="11.5" fill="#a9c0ea">Hudud tashqarisidagi urinish rad etiladi</text>

