  <text x="714" y="188" font-size="13" font-weight="650" letter-spacing="1.3" fill="#6f819f">BUGUN · JONLI</text>

  <g>
    <rect x="714" y="206" width="94.5" height="62" rx="14" fill="#f5f8fd"/>
    <rect x="816.5" y="206" width="94.5" height="62" rx="14" fill="#f5f8fd"/>
    <rect x="919" y="206" width="94.5" height="62" rx="14" fill="#f5f8fd"/>
    <rect x="1021.5" y="206" width="94.5" height="62" rx="14" fill="#f5f8fd"/>
    <g text-anchor="middle" font-size="26" font-weight="680" letter-spacing="-1">
      <text x="761" y="237" fill="#0e9f6e">24</text>
